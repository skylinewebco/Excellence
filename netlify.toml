# MAISON NOIR is a static site — plain HTML, CSS and native ES modules.
# There is NO build step and NO framework, so Netlify must publish the
# repository root exactly as-is (this is what fixes the "Page not found" 404:
# by default/mis-detection Netlify was looking in a build output folder that
# does not exist).

[build]
  publish = "."
  command = "echo 'MAISON NOIR — static site, no build step required.'"

# No SPA redirect is used on purpose: every request maps to a real file and
# navigation is hash-based on a single index.html. A catch-all redirect would
# wrongly mask genuine 404s, so it is intentionally omitted.

# Long-cache the immutable media/assets (source files stay uncached so updates
# always show). Does not change any behaviour — headers only.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
